[project]
name = "hal"
version = "2.0.0a1"
description = "HAL (Heterogeneous AI Layer) — Unified async-first framework for LLMs, Embeddings, Classifiers, and Media Generation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10.0",
    "python-ulid>=3.0.0",
    "httpx>=0.28.0",
    "docstring-parser>=0.16",
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
openai = [
    "openai>=1.60.0",
    "tiktoken>=0.8.0",
]
google = [
    "google-genai>=1.0.0",
]
all = [
    "hal[openai,google]",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "hypothesis>=6.120.0",
    "respx>=0.22.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "types-pyyaml>=6.0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"